appId: com.linz.app
productName: 临智 LINZ
directories:
  buildResources: resources
extraResources:
  # 随包携带 pandoc 二进制（HTML→Word 转换工具 html_to_word 使用）
  # 打包后落在 <安装目录>/resources/bin/win32/pandoc.exe
  - from: resources/bin
    to: bin
  # 随包携带 occt-import-js（OpenCASCADE WASM，STEP 转网格用）
  # 必须脱离 asar（asar 内 .wasm 会被改写，无法加载），打包后落在 <安装目录>/resources/occt/
  - from: resources/occt
    to: occt
  # 随包携带内置技能（docx/pdf/pptx/xlsx 的 SKILL.md + scripts）与 npm 库（docx/pptxgenjs）
  # 打包后落在 <安装目录>/resources/skills/，DB 种子时通过 resolveBundledPath 定位
  - from: resources/skills
    to: skills
# 原生模块必须脱离 asar 打包（.node 二进制无法从 asar 加载）
# sql.js 的 sql-wasm.wasm 也需脱离 asar，否则主进程加载 WASM 会失败（主对话库不可用）
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/node-pty/**'
  - '**/node_modules/sql.js/**'
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
win:
  executableName: linz
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-win7-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # Win7 友好安装体验：非一键安装，让用户选路径
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 创建桌面快捷方式
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 自定义 NSIS 脚本：用于捆绑 VC++ redist 安装（占位，文件不存在则忽略）
  # include: resources/nsis-installer.nsh
